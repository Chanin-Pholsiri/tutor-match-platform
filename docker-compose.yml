services:
  db:
    image: postgres:16-alpine
    container_name: tutor-match-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor_secret
      POSTGRES_DB: tutor_match
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_match"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
